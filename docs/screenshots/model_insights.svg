<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <rect width="1200" height="700" fill="#EEF1F4"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="700" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="24" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0F172A">RAILSETU <tspan fill="#3B6FE8">AI</tspan></text>
  <text x="32" y="124" font-family="sans-serif" font-size="13" fill="#475569">Overview</text>
  <text x="32" y="165" font-family="sans-serif" font-size="13" fill="#475569">Predictive Maintenance</text>
  <text x="32" y="205" font-family="sans-serif" font-size="13" fill="#475569">Maintenance Requests</text>
  <text x="32" y="245" font-family="sans-serif" font-size="13" fill="#475569">Block Planning</text>
  <rect x="16" y="265" width="208" height="38" rx="8" fill="#EFF6FF"/>
  <text x="32" y="289" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1D4ED8">Model Insights</text>
  <!-- Topbar -->
  <rect x="240" y="0" width="960" height="65" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="270" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Model Insights &amp; Empirical Audit (v4)</text>
  <!-- Tabs -->
  <rect x="270" y="85" width="170" height="34" rx="17" fill="#2563EB"/>
  <text x="285" y="107" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">1. Full Metrics Matrix</text>
  <rect x="450" y="85" width="180" height="34" rx="17" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="465" y="107" font-family="sans-serif" font-size="12" fill="#4B5563">2. ROC, PR &amp; Calibration</text>
  <rect x="640" y="85" width="180" height="34" rx="17" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="655" y="107" font-family="sans-serif" font-size="12" fill="#4B5563">3. Threshold Trade-offs</text>
  <rect x="830" y="85" width="160" height="34" rx="17" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="845" y="107" font-family="sans-serif" font-size="12" fill="#4B5563">4. CV &amp; Stability</text>
  <!-- Main Matrix Panel -->
  <rect x="270" y="140" width="895" height="520" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="295" y="175" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Validation Set Evaluation (Selection Phase — 20,000 samples)</text>
  <line x1="295" y1="195" x2="1140" y2="195" stroke="#E2E8F0"/>
  <text x="295" y="225" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">Model | ROC-AUC | PR-AUC (AP) | F1 Score | Balanced Acc | MCC | Kappa | Brier</text>
  <line x1="295" y1="240" x2="1140" y2="240" stroke="#F1F5F9"/>
  <text x="295" y="265" font-family="sans-serif" font-size="12" fill="#64748B">Dummy Baseline: 0.4990 | 0.2016 | 0.2002 | 0.4990 | -0.0021 | -0.0021 | 0.3229</text>
  <text x="295" y="295" font-family="sans-serif" font-size="12" fill="#64748B">Logistic Regression: 0.5321 | 0.2509 | 0.3017 | 0.5183 | 0.0294 | 0.0242 | 0.2484</text>
  <text x="295" y="325" font-family="sans-serif" font-size="12" fill="#64748B">Decision Tree: 0.5503 | 0.3057 | 0.2425 | 0.5468 | 0.1171 | 0.1112 | 0.2301</text>
  <text x="295" y="355" font-family="sans-serif" font-size="12" fill="#64748B">Random Forest: 0.5512 | 0.3250 | 0.2402 | 0.5419 | 0.0997 | 0.0965 | 0.2357</text>
  <text x="295" y="385" font-family="sans-serif" font-size="12" fill="#64748B">HistGradientBoosting: 0.5521 | 0.3260 | 0.2363 | 0.5476 | 0.1263 | 0.1167 | 0.2294</text>
  <text x="295" y="415" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563EB">XGBoost (Best Uncalibrated): 0.5552 | 0.3303 | 0.2622 | 0.5447 | 0.0953 | 0.0948 | 0.2142</text>
  <text x="295" y="445" font-family="sans-serif" font-size="12" fill="#166534">XGBoost (Calibrated): 0.9958* | 0.9861* | 0.4744 | 0.6555 | 0.5146 | 0.4187 | 0.1007</text>
  <!-- Held-out Test Box -->
  <rect x="295" y="475" width="845" height="155" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="315" y="505" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F172A">Held-Out Test Set Generalization (Unbiased — 20,000 samples)</text>
  <text x="315" y="535" font-family="sans-serif" font-size="12" fill="#4B5563">• XGBoost: ROC-AUC 0.5445 | PR-AUC 0.3270 | F1 0.2551 | Balanced Acc 0.5411</text>
  <text x="315" y="565" font-family="sans-serif" font-size="12" fill="#4B5563">• Dummy Classifier: ROC-AUC 0.5039 | PR-AUC 0.2033 | F1 0.2081</text>
  <text x="315" y="595" font-family="sans-serif" font-size="11" fill="#92400E">⚠️ Overfitting &amp; Signal Diagnosis: Model has weak signal. PR-AUC improvement over dummy baseline is modest.</text>
</svg>
